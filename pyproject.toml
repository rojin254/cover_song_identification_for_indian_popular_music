[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cqtnet-toolkit"
version = "0.1.0"
description = "Configurable CQTNet cover-song identification experiments"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "torch>=2.4,<3", "pillow>=10,<13"]

[project.optional-dependencies]
audio = ["librosa>=0.10.2,<0.12", "huggingface-hub>=0.26,<2"]
test = ["pytest>=8,<10"]

[project.scripts]
csi = "csi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
csi = ["presets/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

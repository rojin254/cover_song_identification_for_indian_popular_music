name: CQTNet toolkit CPU

on:
  push:
  pull_request:

jobs:
  cpu:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --frozen --extra audio --extra test
      - run: uv run --extra audio --extra test pytest tests -q
      - run: uv run csi suite --group phase3 --plan
      - run: uv build
